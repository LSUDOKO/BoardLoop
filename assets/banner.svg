<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a4e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff5a4e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset="1" stop-color="#0c1c16"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1d3a2e"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- copper traces -->
  <g fill="none" stroke="#b9853c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M660 140 H760 L800 180 H880"/>
    <path d="M660 170 H740 L780 210 H880"/>
    <path d="M660 420 H760 L800 380 H880"/>
    <path d="M660 450 H740 L780 410 H880"/>
    <path d="M1120 300 H1190"/>
    <path d="M1040 470 V560"/>
    <path d="M960 470 V540 H880"/>
  </g>
  <g fill="#d9a35a"><circle cx="880" cy="180" r="6"/><circle cx="880" cy="210" r="6"/><circle cx="880" cy="380" r="6"/><circle cx="880" cy="410" r="6"/><circle cx="1040" cy="560" r="6"/><circle cx="880" cy="540" r="6"/></g>

  <!-- board -->
  <rect x="880" y="130" width="240" height="340" rx="14" fill="#123326" stroke="#2fd18b" stroke-width="2"/>
  <rect x="912" y="160" width="176" height="110" rx="6" fill="#020605" stroke="#3a5a4c"/>
  <text x="926" y="188" font-family="JetBrains Mono" font-size="13" fill="#9fe9ff">BoardLoop thermostat</text>
  <text x="926" y="232" font-family="JetBrains Mono" font-size="34" font-weight="700" fill="#e6fbff">35.0 C</text>
  <text x="926" y="258" font-family="JetBrains Mono" font-size="13" fill="#9fe9ff">ALERT: too hot</text>
  <rect x="940" y="300" width="120" height="70" rx="6" fill="#0a1a14" stroke="#4b6d5d"/>
  <text x="1000" y="342" font-family="JetBrains Mono" font-size="16" fill="#7fa797" text-anchor="middle">ESP32</text>
  <circle cx="1000" cy="420" r="46" fill="url(#glow)"/>
  <circle cx="1000" cy="420" r="13" fill="#ff5a4e" stroke="#ffd0cc" stroke-width="2"/>
  <g fill="#d9a35a">
    <circle cx="900" cy="300" r="4"/><circle cx="900" cy="320" r="4"/><circle cx="900" cy="340" r="4"/><circle cx="900" cy="360" r="4"/>
    <circle cx="1100" cy="300" r="4"/><circle cx="1100" cy="320" r="4"/><circle cx="1100" cy="340" r="4"/><circle cx="1100" cy="360" r="4"/>
  </g>

  <!-- title -->
  <text x="80" y="210" font-family="Inter Tight" font-size="104" font-weight="800" fill="#f2f7f4" letter-spacing="-3">BoardLoop</text>
  <text x="84" y="270" font-family="Inter Tight" font-size="30" font-weight="500" fill="#a9c7ba">Hermes doesn't just write hardware code.</text>
  <text x="84" y="310" font-family="Inter Tight" font-size="30" font-weight="700" fill="#2fd18b">It proves it works.</text>

  <!-- loop -->
  <g font-family="JetBrains Mono" font-size="20" font-weight="600">
    <rect x="80" y="380" width="128" height="44" rx="22" fill="#14261f" stroke="#2fd18b"/><text x="144" y="409" fill="#e8f5ef" text-anchor="middle">compile</text>
    <text x="222" y="409" fill="#2fd18b">→</text>
    <rect x="248" y="380" width="140" height="44" rx="22" fill="#14261f" stroke="#2fd18b"/><text x="318" y="409" fill="#e8f5ef" text-anchor="middle">simulate</text>
    <text x="402" y="409" fill="#2fd18b">→</text>
    <rect x="428" y="380" width="96" height="44" rx="22" fill="#14261f" stroke="#2fd18b"/><text x="476" y="409" fill="#e8f5ef" text-anchor="middle">test</text>
    <text x="538" y="409" fill="#2fd18b">→</text>
    <rect x="80" y="440" width="84" height="44" rx="22" fill="#14261f" stroke="#2fd18b"/><text x="122" y="469" fill="#e8f5ef" text-anchor="middle">fix</text>
    <text x="178" y="469" fill="#2fd18b">→</text>
    <rect x="204" y="440" width="196" height="44" rx="22" fill="#2fd18b"/><text x="302" y="469" fill="#05140d" text-anchor="middle">✓ verified 3/3</text>
    <text x="414" y="469" fill="#2fd18b">→</text>
    <rect x="440" y="440" width="96" height="44" rx="22" fill="#14261f" stroke="#d9a35a"/><text x="488" y="469" fill="#f3d9b1" text-anchor="middle">flash</text>
  </g>
  <text x="84" y="545" font-family="JetBrains Mono" font-size="17" fill="#6f8f81">ESP32 · Arduino · Wokwi · arduino-cli · a Hermes Agent plugin</text>
</svg>
